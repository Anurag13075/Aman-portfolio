<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aman Sharma — Resume (Curriculum Vitae)</title>
  <meta name="description" content="Resume of Aman Sharma — Junior Accountant & Banking Operations Professional." />

  <!-- Modern Clean Typography: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            dark: {
              bg: '#0c0c0e',
              card: '#131316',
              cardHover: '#18181c',
              border: '#1f1f24',
              borderMuted: '#17171b',
              text: '#ededef',
              muted: '#8e8e99',
              dim: '#5b5b66',
            },
            light: {
              bg: '#fafafa',
              card: '#ffffff',
              cardHover: '#f4f4f5',
              border: '#e4e4e7',
              borderMuted: '#f0f0f2',
              text: '#111113',
              muted: '#63636e',
              dim: '#a1a1aa',
            },
            accent: {
              emerald: '#10b981',
            }
          }
        }
      }
    }
  </script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* PDF Viewport fills remainder of the screen */
    .pdf-viewer-frame {
      width: 100%;
      height: calc(100vh - 56px);
      border: 0;
      display: block;
      background: #525659;
    }

    @media print {
      .no-print { display: none !important; }
      .pdf-viewer-frame { height: 100% !important; }
    }
  </style>
</head>
<body class="bg-light-bg dark:bg-dark-bg text-light-text dark:text-dark-text antialiased transition-colors duration-200 h-screen flex flex-col overflow-hidden">

  <!-- ==================== MINIMAL SLEEK HEADER ==================== -->
  <header class="no-print h-14 shrink-0 bg-light-bg/95 dark:bg-dark-bg/95 backdrop-blur-md border-b border-light-border dark:border-dark-border px-4 sm:px-6 flex items-center justify-between z-20">
    
    <!-- Left: Back Navigation & Profile Tag -->
    <div class="flex items-center gap-3 sm:gap-4 min-w-0">
      <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-mono text-light-muted dark:text-dark-muted hover:text-light-text dark:hover:text-dark-text transition-colors group shrink-0">
        <i data-lucide="arrow-left" class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform"></i>
        <span>Portfolio</span>
      </a>

      <span class="text-light-border dark:text-dark-border">|</span>

      <div class="flex items-center gap-2.5 min-w-0">
        <div class="relative w-7 h-7 rounded-full overflow-hidden ring-1 ring-light-border dark:ring-dark-border shrink-0">
          <img src="aman-sharma.jpg" alt="Aman Sharma" class="w-full h-full object-cover object-top" />
          <span class="absolute bottom-0 right-0 w-2 h-2 bg-emerald-500 border border-dark-bg rounded-full"></span>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5 leading-none">
            <span class="font-semibold text-xs text-light-text dark:text-dark-text truncate">Aman Sharma</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-500 font-mono hidden sm:inline">FlowCV Resume</span>
          </div>
          <div class="text-[10px] text-light-dim dark:text-dark-dim font-mono truncate hidden md:block mt-0.5">
            Junior Accountant • Banking Operations
          </div>
        </div>
      </div>
    </div>

    <!-- Right: Actions & Download -->
    <div class="flex items-center gap-2 shrink-0">
      <!-- Theme Switcher -->
      <button id="theme-toggle" aria-label="Toggle theme" class="p-1.5 rounded text-light-muted dark:text-dark-muted hover:text-light-text dark:hover:text-dark-text border border-transparent hover:border-light-border dark:hover:border-dark-border transition-colors">
        <i id="theme-icon" data-lucide="moon" class="w-4 h-4"></i>
      </button>

      <!-- Open in New Tab -->
      <a href="Aman_Sharma_FlowCV_Resume_2026-10-13.pdf" target="_blank" rel="noopener noreferrer"
         class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-light-border dark:border-dark-border text-light-text dark:text-dark-text hover:bg-light-cardHover dark:hover:bg-dark-cardHover text-xs font-medium transition-colors">
        <i data-lucide="external-link" class="w-3.5 h-3.5 text-light-muted dark:text-dark-muted"></i>
        <span class="hidden sm:inline">Open in Tab</span>
      </a>

      <!-- Download Button -->
      <a href="Aman_Sharma_FlowCV_Resume_2026-10-13.pdf" download="Aman_Sharma_Resume.pdf"
         class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-black text-xs font-semibold shadow-sm transition-all">
        <i data-lucide="download" class="w-3.5 h-3.5"></i>
        <span>Download PDF</span>
      </a>
    </div>

  </header>

  <!-- ==================== NEW UPLOADED PDF RESUME ONLY ==================== -->
  <main class="flex-1 w-full relative bg-neutral-900 overflow-hidden">
    <object
      data="Aman_Sharma_FlowCV_Resume_2026-10-13.pdf#toolbar=1&navpanes=0&view=FitH"
      type="application/pdf"
      class="pdf-viewer-frame"
      aria-label="Aman Sharma FlowCV Resume (PDF)">
      
      <!-- Embedded iframe fallback -->
      <iframe
        src="Aman_Sharma_FlowCV_Resume_2026-10-13.pdf#toolbar=1&navpanes=0&view=FitH"
        class="pdf-viewer-frame"
        title="Aman Sharma Resume">
        
        <!-- Touch/device fallback -->
        <div class="flex flex-col items-center justify-center text-center gap-4 p-8 min-h-full bg-light-card dark:bg-dark-card text-light-text dark:text-dark-text">
          <div class="w-12 h-12 rounded-full bg-emerald-500/10 flex items-center justify-center text-emerald-500">
            <i data-lucide="file-text" class="w-6 h-6"></i>
          </div>
          <div class="space-y-1">
            <h3 class="text-sm font-semibold">Aman Sharma — Curriculum Vitae</h3>
            <p class="text-xs text-light-muted dark:text-dark-muted max-w-sm">
              Your device or browser does not support embedded PDF viewing. Click below to view or download the resume.
            </p>
          </div>
          <div class="flex items-center gap-2 pt-2">
            <a href="Aman_Sharma_FlowCV_Resume_2026-10-13.pdf" target="_blank"
               class="px-4 py-2 rounded-lg bg-light-text dark:bg-dark-text text-light-bg dark:text-dark-bg text-xs font-semibold">
              Open PDF
            </a>
            <a href="Aman_Sharma_FlowCV_Resume_2026-10-13.pdf" download="Aman_Sharma_Resume.pdf"
               class="px-4 py-2 rounded-lg bg-emerald-500 text-black text-xs font-semibold">
              Download PDF
            </a>
          </div>
        </div>
      </iframe>
    </object>
  </main>

  <!-- Script for icons and synced theme -->
  <script>
    lucide.createIcons();

    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const htmlElement = document.documentElement;

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      htmlElement.classList.remove('dark');
      updateThemeIcon(false);
    } else {
      htmlElement.classList.add('dark');
      updateThemeIcon(true);
    }

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        const isDark = htmlElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        updateThemeIcon(isDark);
      });
    }

    function updateThemeIcon(isDark) {
      if (themeIcon) {
        themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
